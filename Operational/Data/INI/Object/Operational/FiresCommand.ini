; Fires Command: a production building per faction for long-range fire support units.
; Everything here derives from existing objects with ObjectVariant and only states what differs.

;------------------------------------------------------------------------------------------------
; Projectiles with enough fuel for the longer ranges
;------------------------------------------------------------------------------------------------

ObjectVariant TC_TheaterCruiseMissile TomahawkMissile
  ReplaceModule ModuleTag_07
    Behavior = MissileAIUpdate TC_ModuleTag_MissileAI
      TryToFollowTarget = Yes
      FuelLifetime = 12000
      IgnitionDelay = 0
      IgnitionFX = FX_TomahawkIgnition
      InitialVelocity = 50
      DistanceToTravelBeforeTurning = 80
      DistanceToTargetBeforeDiving = 100
      DistanceToTargetForLock = 10
    End
  End
End

ObjectVariant TC_LongRangeScudMissile SCUDMissile
  ReplaceModule ModuleTag_07
    Behavior = MissileAIUpdate TC_ModuleTag_MissileAI
      TryToFollowTarget = No
      FuelLifetime = 14000
      IgnitionDelay = 0
      InitialVelocity = 50
      DistanceToTravelBeforeTurning = 200
      DistanceToTargetBeforeDiving = 200
    End
  End
End

;------------------------------------------------------------------------------------------------
; USA
;------------------------------------------------------------------------------------------------

ObjectVariant TC_AmericaFiresCommand AmericaWarFactory
  DisplayName = OBJECT:TC_FiresCommand
  BuildCost   = 2500
  BuildTime   = 40.0
  CommandSet  = TC_AmericaFiresCommandCommandSet
  Prerequisites
    Object = AmericaWarFactory
  End
End

ObjectVariant TC_AmericaTheaterMissileLauncher AmericaVehicleTomahawk
  DisplayName = OBJECT:TC_TheaterMissileLauncher
  BuildCost   = 2400
  BuildTime   = 45.0
  Scale       = 1.2
  Prerequisites
    Object = TC_AmericaFiresCommand
  End
  WeaponSet
    Conditions = None
    Weapon = PRIMARY TC_TheaterCruiseMissileWeapon
  End
End


; Supply vehicles resupply what is close to them, so they can follow an artillery group.

ObjectExtend ChinaVehicleSupplyTruck
  AddModule
    Behavior = SupplySourceUpdate TC_ModuleTag_SupplySource
      SupplyRadius = 120.0
    End
  End
End

ObjectExtend AmericaVehicleChinook

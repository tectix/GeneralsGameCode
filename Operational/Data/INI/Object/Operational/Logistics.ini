; Forward operating bases: cheap supply depots for the front. They accept supply deliveries,
; build supply vehicles and resupply a wider area than the main supply center.

ObjectVariant TC_AmericaForwardBase AmericaSupplyCenter
  DisplayName = OBJECT:TC_ForwardOperatingBase
  BuildCost   = 1000
  BuildTime   = 30.0
  Prerequisites
    Object = AmericaSupplyCenter
  End
  ReplaceModule TC_ModuleTag_SupplySource
    Behavior = SupplySourceUpdate TC_ModuleTag_ForwardSupplySource
      SupplyRadius = 500.0
    End
  End
End

ObjectVariant TC_ChinaForwardBase ChinaSupplyCenter
  DisplayName = OBJECT:TC_ForwardOperatingBase
  BuildCost   = 1000
  BuildTime   = 30.0
  Prerequisites
    Object = ChinaSupplyCenter
  End
  ReplaceModule TC_ModuleTag_SupplySource

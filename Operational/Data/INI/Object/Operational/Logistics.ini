; Supply sources. Allied units in range get their empty RESUPPLY weapons reloaded.

ObjectExtend AmericaSupplyCenter
  AddModule
    Behavior = SupplySourceUpdate TC_ModuleTag_SupplySource
      SupplyRadius = 350.0
    End
  End
End

ObjectExtend ChinaSupplyCenter
  AddModule
    Behavior = SupplySourceUpdate TC_ModuleTag_SupplySource
      SupplyRadius = 350.0
    End
  End
End


; Operational camera settings, loaded after the retail GameData.ini and overriding only these fields.

GameData
  MaxCameraHeight = 3000.0        ; strategic view ceiling
  StrategicZoomHeight = 310.0     ; retail max height, the default and scripted camera range
  StrategicCameraPitch = 70.0     ; pitch reached at MaxCameraHeight

  LastKnownContactDuration = 120.0  ; seconds an enemy unit lost in the fog stays marked
  FogAlpha = 90                     ; darker fog over explored but unwatched ground (retail 127)
End
